name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1,15 * *' # JST 9:00 on 1st and 15th every month

jobs:
  ctest:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04]
        mpisize: [1, 3, 4, 9, 16]
        ompsize: [1]
        include:
          - os: ubuntu-24.04
            mpisize: 1
            ompsize: 3
          - os: macos-latest
            mpisize: 1
            ompsize: 1
      fail-fast: false

    env:
      MPIRUN: "mpiexec --oversubscribe -np ${{ matrix.mpisize }}"
      OMP_NUM_THREADS: ${{ matrix.ompsize }}

    steps:
      - uses: actions/checkout@v4

      - name: apt
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt update
          sudo apt install libblas-dev liblapack-dev openmpi-bin libopenmpi-dev libscalapack-openmpi-dev

      - name: brew
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install openmpi scalapack

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip
        run: |
          python3 -m pip install numpy

      - name: make workspace
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: cmake
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: |
          if [ ${{ runner.os }} = "macOS" ] ; then
            export FC=gfortran-15
          fi
          cmake -DCMAKE_VERBOSE_MAKEFILE=ON $GITHUB_WORKSPACE

      - name: build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cmake --build ./ -j4

      - name: ctest (mpisize=1, exclude mpi consistency/batching)
        if: ${{ matrix.mpisize == 1 }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -V -LE "consistency|batching"

      - name: ctest (mpisize=3/9, spinone only)
        if: ${{ matrix.mpisize == 3 || matrix.mpisize == 9 }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -V -R spinone

      - name: ctest (mpisize=4, baseline)
        if: ${{ matrix.mpisize == 4 }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -V -E spinone -LE "consistency|batching"

      - name: ctest (mpisize=4, mpi consistency)
        if: ${{ matrix.mpisize == 4 }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -V -L consistency

      - name: ctest (mpisize=16, baseline)
        if: ${{ matrix.mpisize == 16 }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -V -E spinone -LE "consistency|batching"

      - name: ctest (mpisize=16, mpi batching)
        if: ${{ matrix.mpisize == 16 }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -V -L batching
