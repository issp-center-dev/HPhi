name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1,15 * *' # JST 9:00 on 1st and 15th every month

jobs:
  elpa:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: 1

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ELPA, ScaLAPACK, and MPI
        run: |
          sudo apt update
          sudo apt install libblas-dev liblapack-dev openmpi-bin libopenmpi-dev \
            libscalapack-openmpi-dev libelpa-dev pkg-config

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install numpy

      - name: Configure ELPA build
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$RUNNER_TEMP/hphi-elpa-build" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DUSE_ELPA=ON

      - name: Build ELPA configuration
        run: cmake --build "$RUNNER_TEMP/hphi-elpa-build" -j4

      - name: ELPA and MPI regression tests (2 ranks)
        env:
          MPIRUN: mpiexec --oversubscribe -np 2
        run: |
          ctest --test-dir "$RUNNER_TEMP/hphi-elpa-build" --output-on-failure \
            -R '^(fulldiag_solver_keyword|green_partial_merge_check|elpa_configure_check|fulldiag_elpa_hubbard_chain|fulldiag_output_open_failure|elpa_redist_check|elpa_statepanel_check|fulldiag_expecmode_equiv_np2|fulldiag_expecmode_scalapack_np2)$'

      - name: ELPA three-rank regression tests
        env:
          MPIRUN: mpiexec --oversubscribe -np 3
        run: |
          ctest --test-dir "$RUNNER_TEMP/hphi-elpa-build" --output-on-failure \
            -R '^(elpa_eigen_check|elpa_statepanel_zero_owner|fulldiag_expecmode_equiv_np3)$'

  ctest:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04]
        mpisize: [1, 3, 4, 9, 16]
        ompsize: [1]
        include:
          - os: ubuntu-24.04
            mpisize: 1
            ompsize: 3
          - os: macos-latest
            mpisize: 1
            ompsize: 1
      fail-fast: false

    env:
      MPIRUN: "mpiexec --oversubscribe -np ${{ matrix.mpisize }}"
      OMP_NUM_THREADS: ${{ matrix.ompsize }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: apt
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt update
          sudo apt install libblas-dev liblapack-dev openmpi-bin libopenmpi-dev libscalapack-openmpi-dev

      - name: brew
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install openmpi scalapack

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: pip
        run: |
          python3 -m pip install numpy

      - name: make workspace
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: cmake
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: |
          if [ ${{ runner.os }} = "macOS" ] ; then
            export FC=gfortran-15
          fi
          cmake -DCMAKE_VERBOSE_MAKEFILE=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 $GITHUB_WORKSPACE

      - name: build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cmake --build ./ -j4

      - name: ctest (mpisize=1, exclude mpi consistency/batching)
        if: ${{ matrix.mpisize == 1 }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -V -LE "consistency|batching"

      - name: ctest (mpisize=3/9, spinone only)
        if: ${{ matrix.mpisize == 3 || matrix.mpisize == 9 }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -V -R spinone

      - name: ctest (mpisize=4, baseline)
        if: ${{ matrix.mpisize == 4 }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -V -E spinone -LE "consistency|batching"

      - name: ctest (mpisize=4, mpi consistency)
        if: ${{ matrix.mpisize == 4 }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -V -L consistency

      - name: ctest (mpisize=16, baseline)
        if: ${{ matrix.mpisize == 16 }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -V -E spinone -LE "consistency|batching"

      - name: ctest (mpisize=16, mpi batching)
        if: ${{ matrix.mpisize == 16 }}
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ctest -V -L batching
